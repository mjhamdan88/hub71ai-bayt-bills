{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}Credential Setup Complete{% endblock %}

{% block extrastyle %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    /* Hide admin chrome for this public-facing page */
    #header,
    .breadcrumbs {
        display: none;
    }
    body {
        background: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        color: #0b1727;
    }
    .page-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        padding: 22px;
        text-align: center;
        border: 1px solid #e6e6e6;
    }
    .success-message {
        color: #15803d;
        margin-bottom: 14px;
        font-weight: 600;
    }
    .success-icon {
        font-size: 48px;
        margin-bottom: 12px;
    }
    .card h1 {
        font-size: 1.3rem;
        margin-bottom: 10px;
        color: #111827;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
    <div class="card">
        <div class="success-icon">✓</div>
        <h1>Setup Complete</h1>
        
        <div class="success-message">
            Your credentials have been securely saved.
        </div>
        
        <p>You can now close this window.</p>
    </div>
</div>
{% endblock %}
