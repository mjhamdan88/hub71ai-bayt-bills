{% extends "admin/base_site.html" %}
{% load static %}

{% block title %}Credential Setup Error{% endblock %}

{% block extrastyle %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    /* Hide admin chrome for this public-facing page */
    #header,
    .breadcrumbs {
        display: none;
    }
    body {
        background: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        color: #0b1727;
    }
    .page-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        width: 100%;
        max-width: 480px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        padding: 22px;
        text-align: center;
        border: 1px solid #e6e6e6;
    }
    .card h1 {
        font-size: 1.3rem;
        margin-bottom: 10px;
        color: #111827;
    }
    .error-message {
        color: #b91c1c;
        margin-bottom: 14px;
        font-weight: 600;
    }
    .contact-info {
        color: #4b5563;
        font-size: 0.95rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
    <div class="card">
        <h1>Setup Error</h1>
        
        <div class="error-message">
            {{ error }}
        </div>
        
        {% if show_contact %}
        <div class="contact-info">
            Please contact your administrator for assistance.
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
