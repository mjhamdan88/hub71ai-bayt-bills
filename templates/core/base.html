<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayt · A little peace of mind</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#213b36;font:15px/1.6 system-ui,sans-serif}a{color:inherit}header{height:86px;border-bottom:1px solid #dedfd6;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#fffef9} .brand{font-size:32px;font-weight:750;text-decoration:none;letter-spacing:-1.5px}.brand span{color:#b59b59;font-size:25px}nav{display:flex;gap:26px;align-items:center}nav a{text-decoration:none}main{max-width:1180px;margin:40px auto;padding:0 24px}h1{font:normal 42px/1.2 Georgia,serif;margin:8px 0 14px}h2{font-size:21px;margin:0 0 14px}h3{font-size:16px}p{margin:8px 0 18px}.muted,small{color:#697a73}.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px}.pill{display:inline-block;background:#edf0d9;color:#536136;border-radius:25px;padding:5px 13px;font-size:11px;font-weight:700}.card{background:#fffefb;border:1px solid #e1e3d9;border-radius:18px;padding:25px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:28px 0}.stat{padding:22px;background:#e8ede5;border-radius:15px}.stat strong{display:block;font-size:30px;font-weight:550;margin-top:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.bill{padding:16px 0;border-top:1px solid #eceee6}.bubble{padding:15px 19px;background:#eff2eb;border-radius:4px 16px 16px 16px;margin:12px 0;white-space:pre-wrap}.bubble.user{background:#e7edf6;margin-left:40px}.chat{max-height:360px;overflow:auto}button,.button{border:0;background:#244e41;color:white;border-radius:9px;padding:11px 17px;font:600 13px system-ui;cursor:pointer;text-decoration:none;display:inline-block}button:hover{background:#356954}input{padding:12px;border:1px solid #cdd4ca;border-radius:8px;background:white;font:inherit;max-width:100%}input[type=checkbox]{accent-color:#244e41}label{display:block;margin:12px 0 6px}form p input{display:block;width:100%}.errorlist{color:#a83232;padding-left:20px}.helptext{display:block;font-size:12px;color:#697a73}progress{width:100%;height:8px;accent-color:#6e9071}.notice{padding:13px;border-radius:9px;background:#eee8cd;margin-bottom:18px}details{margin:12px 0}summary{cursor:pointer}footer{padding:30px;text-align:center;font-size:12px;color:#697a73}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:11px 6px;border-bottom:1px solid #eee}section{scroll-margin-top:20px}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}nav{gap:10px;font-size:12px}header{padding:0 20px}h1{font-size:34px}.row{flex-wrap:wrap}main{padding:0 16px;margin-top:25px}}</style></head><body><header><a class="brand" href="/">⌂ Bayt<span> .</span></a><nav>{% if user.is_authenticated %}<a href="/#conversation">Assistant</a><a href="/#budgets">Budgets</a><a href="/#history">History</a><form action="/logout/" method="post">{% csrf_token %}<button>Sign out</button></form>{% else %}<span class="pill">HOUSEHOLD FINANCE DEMO</span>{% endif %}</nav></header><main>{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><footer>Bayt · Your home, in balance. Virtual data only. No bank or email account connected.</footer></body></html>
