<script type="importmap">{"imports":{"lit":"https://cdn.jsdelivr.net/npm/lit@3.2.0/+esm","lit/directives/unsafe-html.js":"https://cdn.jsdelivr.net/npm/lit@3.2.0/directives/unsafe-html.js/+esm"}}</script>
<script type="module">
import {UnicomChatWithSidebar} from '{% static "unicom/webchat/webchat-with-sidebar.js" %}?v=actions3';
import {LitElement,css} from 'lit';
class BaytChat extends UnicomChatWithSidebar {
 static styles=[...UnicomChatWithSidebar.styles,css`.sidebar{display:block!important;width:230px;min-width:230px}.mobile-back-btn{display:none!important}.chat-main{display:flex!important}@media(max-width:600px){.sidebar{width:140px;min-width:140px}}:host{--primary-color:#286452}.unicom-chat-container{--primary-color:#286452}`];
 connectedCallback(){this.addEventListener('finance-action',e=>this._confirmAction(e.detail));LitElement.prototype.connectedCallback.call(this);this.currentChatId=null;this.loadChats();}
 async loadChats(){this.loadingChats=true;try{const r=await fetch('/finance-chat/chats/');if(!r.ok)throw Error('Unable to load chats');this.chats=(await r.json()).chats;if(!this._newDraft&&!this.currentChatId&&!this.sending&&this.chats.length){this.currentChatId=this.chats[0].id;await this.loadMessages();}}catch(e){this.error=e.message}finally{this.loadingChats=false}}
 async _handleChatSelected(e){if(this.sending||this._actionBusy){this.error='Please wait for the current reply to finish.';return}this._newDraft=false;this.currentChatId=e.detail.chatId;this.error=null;await this.loadMessages();}
 _handleNewChat(){this._newDraft=true;if(this.sending||this._actionBusy){this.error='Please wait for the current reply to finish.';return}this.currentChatId=null;this.messages=[];this.processedMessages=[];this.error=null;}
 async loadMessages(){const selected=this.currentChatId;this.loading=true;try{const r=await fetch('/finance-chat/messages/?chat_id='+encodeURIComponent(this.currentChatId||''));if(!r.ok)throw Error('Please sign in again.');const d=await r.json();if(selected!==this.currentChatId||this._newDraft)return;this.messages=d.messages;this.processedMessages=this.messages;}catch(e){this.error=e.message}finally{this.loading=false}}
 _processMessagesWithBranching(messages){return messages;}
 _handleEditMessage(){this.error='To clarify a previous question, send a new message below.';}
 async firstUpdated(){const input=this.shadowRoot.querySelector('message-input');await input.updateComplete;const style=document.createElement('style');style.textContent='.attach-btn{display:none!important}';input.shadowRoot.append(style);const list=this.shadowRoot.querySelector('chat-list');await list.updateComplete;const hide=document.createElement('style');hide.textContent='.delete-chat-btn,.chat-delete-btn{display:none!important}';list.shadowRoot.append(hide);}
 async _confirmAction(button){
  if(this.sending||this._actionBusy||button.disabled)return;
  this._actionBusy=true;this.error=null;
  const originalMessages=this.messages;this.messages=this.messages.map(m=>({...m,interactive_buttons:m.interactive_buttons?.map(row=>row.map(b=>({...b,disabled:true})))}));this.processedMessages=this.messages;
  try{
   const response=await fetch('/actions/'+button.action_id+'/',{method:'POST',headers:{'X-CSRFToken':document.querySelector('input[name=csrfmiddlewaretoken]').value,'Accept':'application/json','Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({decision:button.decision})});
   if(!response.ok)throw Error('Unable to process your decision. Please try again.');
   const result=await response.json();
   document.dispatchEvent(new Event('finance-data-changed'));
   this.messages=originalMessages.map(m=>result.messages.find(updated=>updated.id===m.id)||m);this.processedMessages=this.messages;
   await this._handleSendMessage({detail:{text:'Continue',actionId:button.action_id}});
  }catch(error){this.error=error.message;await this.loadMessages();}finally{this._actionBusy=false;}
 }
 async _handleSendMessage(e){
  const {text,file,actionId}=e.detail;if(this.sending||!text.trim())return;if(file){this.error='Text questions only.';return}
  this.sending=true;this.error=null;let finished=false;
  try{
   const form=new FormData();form.append('text',text);if(actionId)form.append('action_id',actionId);if(this.currentChatId)form.append('chat_id',this.currentChatId);
   const csrf=document.querySelector('input[name=csrfmiddlewaretoken]').value;
   const response=await fetch('/finance-chat/stream/',{method:'POST',headers:{'X-CSRFToken':csrf},body:form});
   if(!response.ok){const error=await response.json();throw Error(error.error||'Unable to send');}
   const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';
   while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let boundary;
    while((boundary=buffer.indexOf('\n\n'))>=0){const packet=buffer.slice(0,boundary);buffer=buffer.slice(boundary+2);if(!packet.startsWith('data: '))continue;const event=JSON.parse(packet.slice(6));
     if(event.type==='user.message'){this._newDraft=false;this.currentChatId=event.chat_id;this.messages=[...this.messages,event.message];this.processedMessages=this.messages;this.sendAck+=1;}
     else if(event.type==='tool.message'){this.messages=[...this.messages,event.message];this.processedMessages=this.messages;} else if(event.type==='action.ready'){this.dispatchEvent(new CustomEvent('action-ready',{detail:event,bubbles:true,composed:true}));} else {this._handleStreamEvent(event,this.currentChatId,'bayt-response');if(event.type==='response.text.delta')this.dataset.streamDeltas=String(Number(this.dataset.streamDeltas||0)+1);if(event.type==='response.failed')throw Error(event.error);if(event.type==='response.finished'){finished=true;this.messages=this.messages.map(m=>m.id==='unicom-stream-'+event.stream_id?event.message:m);this.processedMessages=this.messages;}}
    }
   }
   if(!finished)throw Error('Connection interrupted. Please try again.');
  }catch(error){this.error=error.message;}finally{this.sending=false;await this.loadChats();}
 }
}
customElements.define('bayt-chat',BaytChat);

const panel=document.getElementById('bayt-chat'),toggle=document.getElementById('chat-toggle');
function close(){panel.hidden=true;toggle.setAttribute('aria-expanded','false');toggle.focus()}
toggle.addEventListener('click',()=>{if(!panel.hidden){close();return}panel.hidden=false;toggle.setAttribute('aria-expanded','true');if(!document.querySelector('bayt-chat')){let chat=document.createElement('bayt-chat');chat.setAttribute('api-base','/finance-chat');chat.setAttribute('auto-refresh','0');chat.style.cssText='display:block;flex:1;min-height:0;height:100%';document.getElementById('chat-mount').append(chat)}});document.getElementById('chat-close').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden)close()});
</script>{% endblock %}
